[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mvselfies"
version = "0.1.0"
description = "Experiments for Fragment-Distribution Fidelity in SELFIES VAEs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0",
  "selfies==2.1.1",
  "rdkit==2025.3.6",
  "numpy==1.26.4",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mvselfies*"]
